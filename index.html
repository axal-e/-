<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>돟멍타임</title>
	<link rel="icon" href="kdh.png">
	<style>
		body {
			margin: 0;
			overflow: hidden;
			background-color: #FFC2F7;
			font-family: Arial, sans-serif;
		}

		.timer {
			position: fixed;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			font-size: clamp(32px, 7vw, 100px);
			font-weight: 900;
			color: white;
			white-space: nowrap;
			font-variant-numeric: tabular-nums;
			z-index: 0;
			pointer-events: none;
		}

		.title {
			position: fixed;
			left: 50%;
			bottom: 20px;
			transform: translateX(-50%);
			font-size: 28px;
			font-weight: 900;
			color: white;
			white-space: nowrap;
			z-index: 2;
			pointer-events: none;
		}

		.img {
			width: 200px;
			height: auto;
			position: absolute;
			pointer-events: none;
			z-index: 1;
			filter:
				drop-shadow(2px 0 0 white)
				drop-shadow(-2px 0 0 white)
				drop-shadow(0 2px 0 white)
				drop-shadow(0 -2px 0 white);
		}
	</style>
</head>
<body>
	<div class="timer" id="timer">00:00:00.000</div>
	<div class="title">돟멍타임!</div>

	<script>
		const timer = document.getElementById("timer");
		const startTime = performance.now();

		function updateTimer() {
			const elapsed = Math.floor(performance.now() - startTime);

			const hours = Math.floor(elapsed / 3600000);
			const minutes = Math.floor((elapsed % 3600000) / 60000);
			const seconds = Math.floor((elapsed % 60000) / 1000);
			const milliseconds = elapsed % 1000;

			timer.textContent =
				String(hours).padStart(2, "0") + ":" +
				String(minutes).padStart(2, "0") + ":" +
				String(seconds).padStart(2, "0") + "." +
				String(milliseconds).padStart(3, "0");

			requestAnimationFrame(updateTimer);
		}

		updateTimer();

		const MAX_IMAGES = 80;
		const images = [];
		let index = 0;

		for (let i = 0; i < MAX_IMAGES; i++) {
			const img = document.createElement("img");
			img.src = "kdh.png";
			img.className = "img";
			img.draggable = false;
			document.body.appendChild(img);
			images.push(img);
		}

		function randImage() {
			const img = images[index];

			const randX = Math.random() * window.innerWidth;
			const randY = Math.random() * window.innerHeight;

			img.style.left = randX - 100 + "px";
			img.style.top = randY - img.offsetHeight / 2 + "px";
			img.style.display = "block";

			index = (index + 1) % MAX_IMAGES;
		}

		setInterval(randImage, 300);
	</script>
</body>
</html>
